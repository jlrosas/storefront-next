<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú de pizzas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E4D33}a:hover{color:#133423}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F6F1; font-family: 'Barlow', sans-serif; color: #1B1D1A; overflow: hidden; position: relative">

  <header style="background: #1E4D33; color: #FFFFFF; height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; line-height: 0.9; letter-spacing: 0.5px">PAPA<br>JOHNS</div>
    <button type="button" style="flex: 1; min-width: 0; background: none; border: 0; color: #FFFFFF; text-align: left; padding: 0; cursor: pointer; font-family: 'Barlow', sans-serif">
      <div style="font-size: 12px; opacity: 0.85">Retiro · listo en 15 min</div>
      <div style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 4px">El Bosque
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </button>
    <a href="Pedido.dc.html" aria-label="Ver pedido, 0 productos" style="width: 44px; height: 44px; border-radius: 10px; background: #D7EA4A; color: #133423; display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6"></path></svg>
    </a>
  </header>

  <nav aria-label="Categorías" style="display: flex; gap: 8px; padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid #E4E2DA; overflow-x: auto; flex-shrink: 0">
    <a href="#" style="flex-shrink: 0; padding: 10px 16px; border-radius: 999px; background: #1E4D33; color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none">Pizzas</a>
    <a href="#" style="flex-shrink: 0; padding: 10px 16px; border-radius: 999px; background: #EFEEE7; color: #1B1D1A; font-weight: 600; font-size: 14px; text-decoration: none">Acompañamientos</a>
    <a href="Simple-Add.dc.html" style="flex-shrink: 0; padding: 10px 16px; border-radius: 999px; background: #EFEEE7; color: #1B1D1A; font-weight: 600; font-size: 14px; text-decoration: none">Bebidas</a>
    <a href="#" style="flex-shrink: 0; padding: 10px 16px; border-radius: 999px; background: #EFEEE7; color: #1B1D1A; font-weight: 600; font-size: 14px; text-decoration: none">Postres</a>
  </nav>

  <main style="flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: 0.3px">Pizzas</h1>

    <sc-for list="{{pizzas}}" as="p" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; gap: 12px; box-shadow: 0 1px 2px rgba(19,52,35,0.08)">
        <img src="{{p.img}}" alt="{{p.name}}" style="width: 104px; height: 104px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #EFEEE7">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <sc-if value="{{p.top}}" hint-placeholder-val="{{true}}">
            <span style="align-self: flex-start; background: #D7EA4A; color: #133423; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.3px">Más vendida</span>
          </sc-if>
          <a href="PDP-Mobile.dc.html" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: #1B1D1A; text-decoration: none; line-height: 1.1">{{p.name}}</a>
          <p style="margin: 0; font-size: 13px; line-height: 1.35; color: #5A5F57; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.desc}}</p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto">
            <div style="font-size: 13px; color: #5A5F57">Familiar<br><strong style="font-size: 17px; color: #1B1D1A">{{p.price}}</strong></div>
            <a href="Sheet-Pizza.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #1E4D33; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              Agregar
            </a>
          </div>
        </div>
      </article>
    </sc-for>
  </main>

  <nav aria-label="Principal" style="height: 64px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E4E2DA; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="{{t.style}}">
        <span style="width: 24px; height: 4px; border-radius: 2px; background: {{t.bar}}"></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; text-decoration: none; ';
    const tabs = [
      { label: 'Inicio', href: '#' },
      { label: 'Menú', href: '#', active: true },
      { label: 'Promos', href: '#' },
      { label: 'Pedido', href: 'Pedido.dc.html' },
      { label: 'Cuenta', href: '#' }
    ].map((t) => ({
      ...t,
      style: base + (t.active ? 'color: #1E4D33; font-weight: 700' : 'color: #5A5F57; font-weight: 500'),
      bar: t.active ? '#1E4D33' : 'transparent'
    }));
    return {
      tabs,
      pizzas: [
        { name: 'Pollo BBQ', desc: 'Queso mozzarella, pollo, tocino, cebolla y salsa BBQ.', price: '$16.900', top: true, img: '/_blob/f14a3785dacd216a7a3dfcc2bfeb7f7f' },
        { name: 'Todas las Carnes', desc: 'Queso mozzarella, pepperoni, jamón, tocino y salchicha italiana.', price: '$18.900', top: true, img: '/_blob/824225d8a240e5b2be845849aa16f704' },
        { name: 'Super Pepperoni', desc: 'Extra queso mozzarella y doble pepperoni.', price: '$16.900', top: false, img: '/_blob/81784b9c91ff83aa183db88009bc0acd' },
        { name: 'Hawaiana', desc: 'Piña, jamón y extra queso mozzarella.', price: '$13.900', top: false, img: '/_blob/e15fc348bae8f7bbc493de3deea75c9c' }
      ]
    };
  }
}
</script>
</body>
</html>
